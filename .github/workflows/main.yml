name: Deploy Hora do Rancho no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar todo o projeto como artefato do Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "." # <--- ESTA LINHA É OBRIGATÓRIA PARA USAR A RAIZ DO REPOSITÓRIO

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
